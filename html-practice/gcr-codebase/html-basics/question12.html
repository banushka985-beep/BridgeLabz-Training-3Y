<!DOCTYPE html>
<html>
<head>
    <title>Inline Formatting</title>
</head>
<body>

    <p>
        I am <strong>learning HTML</strong> and
        <em>enjoying web development</em>.
        HTML is <mark>easy to learn</mark>.
        <small>Keep practicing!</small><br>
        Practice makes coding better.
    </p>

</body>
</html>
