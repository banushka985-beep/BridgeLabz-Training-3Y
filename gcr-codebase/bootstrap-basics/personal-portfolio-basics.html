<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="personal-portfolio-basics.css">
</head>

<body class="bg-light text-dark">

    <header class="bg-dark text-white text-center p-5">
        <!-- p-5 = Bootstrap padding utility -->
        <h1 class="fw-bold">Anushka Bansal</h1>
        <p class="lead mb-0">
            Computer Science Student & Aspiring Developer
        </p>
    </header>

    <main>

        <section class="container text-center py-5">

            <img
                src="https://i.pravatar.cc/250?img=47"
                class="img-fluid rounded-circle profile-img mb-4"
                alt="Profile photo">

            <h2 class="fw-bold">Hello, I'm Anushka</h2>

            <p class="text-muted">
                I am learning Java, Web Development and modern software
                development technologies.
            </p>

            <div class="my-4">
                <!-- Bootstrap button utilities -->
                <a href="#" class="btn btn-primary me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-dark">
                    Download CV
                </a>
            </div>

            <!-- Contact Form -->
            <div class="row justify-content-center mt-4">
                <div class="col-md-6">

                    <form class="bg-white p-4 shadow-sm rounded">

                        <h3 class="mb-3">Contact Me</h3>

                        <input
                            type="text"
                            class="form-control mb-3"
                            placeholder="Your Name">

                        <input
                            type="email"
                            class="form-control mb-3"
                            placeholder="Your Email">

                        <textarea
                            class="form-control mb-3"
                            rows="4"
                            placeholder="Your Message"></textarea>

                        <button class="btn btn-primary w-100">
                            Send Message
                        </button>

                    </form>

                </div>
            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 Anushka Bansal</p>
    </footer>

</body>
</html>
