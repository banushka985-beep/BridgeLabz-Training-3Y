<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="product-catalog.css">
</head>

<body>

    <header class="bg-dark text-white text-center py-4">
        <h1>Nova Store</h1>
        <p class="mb-0">Quality products at great prices</p>
    </header>

    <main>

        <section class="container py-5">

            <h2 class="text-center fw-bold mb-5">
                Featured Products
            </h2>

            <div class="row g-4">

                <!-- col-md-3 = 4 columns on medium and larger screens -->
                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card product-card h-100 shadow-sm">

                        <img
                            src="https://picsum.photos/400/300?random=21"
                            class="card-img-top"
                            alt="Smart Watch">

                        <div class="card-body text-center">
                            <h3 class="h5">Smart Watch</h3>
                            <p class="fw-bold text-primary">₹2,999</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>

                    </article>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card product-card h-100 shadow-sm">

                        <img
                            src="https://picsum.photos/400/300?random=22"
                            class="card-img-top"
                            alt="Wireless Headphones">

                        <div class="card-body text-center">
                            <h3 class="h5">Wireless Headphones</h3>
                            <p class="fw-bold text-primary">₹1,999</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>

                    </article>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card product-card h-100 shadow-sm">

                        <img
                            src="https://picsum.photos/400/300?random=23"
                            class="card-img-top"
                            alt="Laptop">

                        <div class="card-body text-center">
                            <h3 class="h5">Laptop</h3>
                            <p class="fw-bold text-primary">₹59,999</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>

                    </article>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card product-card h-100 shadow-sm">

                        <img
                            src="https://picsum.photos/400/300?random=24"
                            class="card-img-top"
                            alt="Smartphone">

                        <div class="card-body text-center">
                            <h3 class="h5">Smartphone</h3>
                            <p class="fw-bold text-primary">₹24,999</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>

                    </article>
                </div>

            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 Nova Store</p>
    </footer>

</body>
</html>
