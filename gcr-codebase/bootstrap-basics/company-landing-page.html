<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaTech - Company Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="company-landing-page.css">
</head>

<body>

    <!-- Header and Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <!-- .navbar-brand creates the company logo/name -->
                <a class="navbar-brand fw-bold" href="#">NovaTech</a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNav">
                    <!-- Bootstrap Flex utility aligns navigation -->
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <!-- Hero Section -->
        <section class="hero py-5">
            <div class="container">
                <div class="row align-items-center">

                    <div class="col-lg-7 text-center text-lg-start">
                        <h1 class="display-3 fw-bold">
                            Build Smarter. Grow Faster.
                        </h1>

                        <p class="lead my-4">
                            NovaTech helps startups create modern digital
                            products that solve real-world problems.
                        </p>

                        <a href="#" class="btn btn-primary btn-lg">
                            Get Started
                        </a>
                    </div>

                    <div class="col-lg-5 text-center mt-4 mt-lg-0">
                        <img
                            src="https://picsum.photos/600/400?random=10"
                            class="img-fluid rounded shadow"
                            alt="Technology workspace">
                    </div>

                </div>
            </div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 NovaTech. All rights reserved.</p>
    </footer>

</body>
</html>
