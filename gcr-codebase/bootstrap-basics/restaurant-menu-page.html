<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Today's Menu</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="restaurant-menu-page.css">
</head>

<body>

    <header class="bg-dark text-white text-center py-5">
        <h1>Spice Garden</h1>
        <p class="lead mb-0">Today's Special Menu</p>
    </header>

    <main>

        <section class="container py-5">

            <!-- Food image -->
            <figure class="text-center mb-5">
                <img
                    src="https://picsum.photos/900/350?random=30"
                    class="img-fluid rounded"
                    alt="Restaurant food">

                <figcaption class="mt-2 text-muted">
                    Freshly prepared dishes from our kitchen
                </figcaption>
            </figure>

            <div class="row g-5">

                <!-- Menu Table -->
                <div class="col-lg-8">

                    <h2 class="text-center mb-4">Today's Menu</h2>

                    <div class="table-responsive">

                        <table class="table table-striped table-hover">

                            <thead class="table-dark">
                                <tr>
                                    <th>Dish</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td>Paneer Tikka</td>
                                    <td>Starter</td>
                                    <td>₹280</td>
                                </tr>

                                <tr>
                                    <td>Veg Biryani</td>
                                    <td>Main Course</td>
                                    <td>₹320</td>
                                </tr>

                                <tr>
                                    <td>Butter Naan</td>
                                    <td>Bread</td>
                                    <td>₹60</td>
                                </tr>

                                <tr>
                                    <td>Gulab Jamun</td>
                                    <td>Dessert</td>
                                    <td>₹120</td>
                                </tr>
                            </tbody>

                        </table>

                    </div>

                </div>

                <!-- Chef's Specials -->
                <aside class="col-lg-4">

                    <h2 class="h4 mb-3">Chef's Specials</h2>

                    <ul class="list-group">
                        <li class="list-group-item">
                            Malai Kofta
                        </li>

                        <li class="list-group-item">
                            Dal Makhani
                        </li>

                        <li class="list-group-item">
                            Tandoori Platter
                        </li>

                        <li class="list-group-item">
                            Mango Lassi
                        </li>
                    </ul>

                </aside>

            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 Spice Garden Restaurant</p>
    </footer>

</body>
</html>
