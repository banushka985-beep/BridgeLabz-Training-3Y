<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="ques8.css">
</head>
<body>

<header>
    <h1>CSS Box Model</h1>
</header>

<main>

    <section class="box-model">

        <div class="margin-layer">

            <div class="border-layer">

                <div class="padding-layer">

                    <div class="content">
                        Content
                    </div>

                </div>

            </div>

        </div>

    </section>

    <section class="description">
        <p><strong>Content:</strong> Actual information inside the box.</p>
        <p><strong>Padding:</strong> Space between content and border.</p>
        <p><strong>Border:</strong> Line surrounding padding.</p>
        <p><strong>Margin:</strong> Space outside the border.</p>
    </section>

</main>

</body>
</html>
