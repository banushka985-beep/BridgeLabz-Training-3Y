<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="ques6.css">
</head>
<body>

<header>
    <h1>CSS Transformations</h1>
</header>

<main class="transform-container">

    <div class="item">
        <div class="box rotate">Rotate</div>
        <p>rotate()</p>
    </div>

    <div class="item">
        <div class="box scale">Scale</div>
        <p>scale()</p>
    </div>

    <div class="item">
        <div class="box translate">Translate</div>
        <p>translate()</p>
    </div>

    <div class="item">
        <div class="box skew">Skew</div>
        <p>skew()</p>
    </div>

</main>

</body>
</html>
