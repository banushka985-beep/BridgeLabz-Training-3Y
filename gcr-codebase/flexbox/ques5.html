<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing</title>
    <link rel="stylesheet" href="ques5.css">
</head>
<body>

<h1>Choose Your Plan</h1>

<main class="pricing">

    <div class="card">
        <h2>Basic</h2>
        <h3>₹499</h3>
        <p>1 User</p>
        <p>5 Projects</p>
        <button>Choose Plan</button>
    </div>

    <div class="card popular">
        <h2>Standard</h2>
        <h3>₹999</h3>
        <p>5 Users</p>
        <p>20 Projects</p>
        <button>Choose Plan</button>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <h3>₹1499</h3>
        <p>Unlimited Users</p>
        <p>Unlimited Projects</p>
        <button>Choose Plan</button>
    </div>

</main>

</body>
</html>
