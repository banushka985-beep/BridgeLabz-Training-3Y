<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Combined Effects Demonstration</title>
  <link rel="stylesheet" href="q9_combined_effects.css" />
</head>
<body>
  <header>
    <h1>Combined Effects</h1>
    <p>Pseudo-classes, transitions and transforms working together.</p>
  </header>

  <main>
    <section class="effects-row">
      <button class="effect-card">Grow &amp; Glow</button>
      <button class="effect-card">Lift Up</button>
      <button class="effect-card">Tilt Slightly</button>
      <button class="effect-card">Brighten</button>
    </section>
  </main>

  <footer>
    <p>Hover each card to see the combined transform and color transition.</p>
  </footer>
</body>
</html>
