<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Showcase</title>
  <link rel="stylesheet" href="q3_image_showcase.css" />
</head>
<body>
  <header>
    <h1>Scenic Showcase</h1>
    <p>Hover over any photo to see it scale and darken.</p>
  </header>

  <main>
    <section class="gallery">

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/mountain/400/300" alt="Mountain range at sunset" />
        <figcaption>Mountain Range</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/forest/400/300" alt="Dense green forest" />
        <figcaption>Forest Trail</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/beach/400/300" alt="Sandy beach with waves" />
        <figcaption>Coastal Beach</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/city/400/300" alt="City skyline at night" />
        <figcaption>City Skyline</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/desert/400/300" alt="Sand dunes in a desert" />
        <figcaption>Desert Dunes</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/lake/400/300" alt="Calm lake surrounded by trees" />
        <figcaption>Quiet Lake</figcaption>
      </figure>

    </section>
  </main>

  <footer>
    <p>Layout adapts to a single column below 700px width.</p>
  </footer>
</body>
</html>
