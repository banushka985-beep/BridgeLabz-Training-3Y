<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Interface Components</title>
  <link rel="stylesheet" href="q7_ui_components.css" />
</head>
<body>
  <header>
    <h1>Interface Components</h1>
    <p>A search bar, buttons and a dropdown, styled consistently.</p>
  </header>

  <main>
    <section class="ui-card">

      <div class="ui-row">
        <input class="search-bar" type="search" placeholder="Search anything..." />
        <button class="ui-btn ui-btn-primary">Search</button>
      </div>

      <div class="ui-row">
        <label for="category">Category</label>
        <select id="category" class="ui-dropdown">
          <option>All</option>
          <option>Articles</option>
          <option>Images</option>
          <option>Videos</option>
        </select>
      </div>

      <div class="ui-row">
        <button class="ui-btn ui-btn-secondary">Cancel</button>
        <button class="ui-btn ui-btn-primary">Apply</button>
      </div>

    </section>
  </main>

  <footer>
    <p>Focus a field or hover a button to see the highlight states.</p>
  </footer>
</body>
</html>
