<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="q5_button_collection.css" />
</head>
<body>
  <header>
    <h1>Button Style Collection</h1>
    <p>Primary, secondary, outline and disabled variants.</p>
  </header>

  <main>
    <section class="button-row">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-outline">Outline</button>
      <button class="btn btn-primary" disabled>Disabled</button>
      <input class="btn btn-outline" type="text" placeholder="Focus me" />
    </section>
  </main>

  <footer>
    <p>Try clicking, tabbing, and hovering over each button.</p>
  </footer>
</body>
</html>
