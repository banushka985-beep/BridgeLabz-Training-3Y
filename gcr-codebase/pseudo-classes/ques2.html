<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tooltip Demonstration</title>
  <link rel="stylesheet" href="q2_tooltips.css" />
</head>
<body>
  <header>
    <h1>CSS-Only Tooltips</h1>
    <p>Hover over each item to reveal a short description.</p>
  </header>

  <main>
    <section class="tooltip-stage">

      <span class="tooltip-wrap">
        <span class="icon">&#9733;</span>
        <span class="tooltip-box">Favorite this page</span>
      </span>

      <span class="tooltip-wrap">
        <span class="icon">&#128231;</span>
        <span class="tooltip-box">You have new messages</span>
      </span>

      <span class="tooltip-wrap">
        <span class="icon">&#9881;</span>
        <span class="tooltip-box">Open settings menu</span>
      </span>

      <span class="tooltip-wrap">
        <span class="icon">&#128274;</span>
        <span class="tooltip-box">Account is secured</span>
      </span>

      <span class="tooltip-wrap">
        <span class="icon">&#10004;</span>
        <span class="tooltip-box">Task marked complete</span>
      </span>

    </section>
  </main>

  <footer>
    <p>Built with pure CSS using absolute positioning and opacity transitions.</p>
  </footer>
</body>
</html>
